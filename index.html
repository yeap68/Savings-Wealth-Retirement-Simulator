<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018">
<title>Savings, Wealth & Retirement Simulator</title>
<style>
:root{--bg:#081018;--panel:#101923;--card:#16212d;--line:#2a3948;--text:#f5f7fa;--muted:#9fb0bf;--blue:#62a0ff;--green:#42d49b;--amber:#f0b45a;--red:#ff7474;--shadow:0 12px 34px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:linear-gradient(180deg,#09111a,#081018 280px);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}a{color:#8bb7ff}.app{max-width:1120px;margin:auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:20;background:rgba(8,16,24,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}
.brand{font-weight:800;font-size:18px}.sub{color:var(--muted);font-size:13px}.stepbar{height:3px;background:#1c2a37;margin-top:8px;border-radius:4px;overflow:hidden}.stepbar i{display:block;height:100%;background:var(--blue)}
main{padding-top:18px}.hero{padding:20px 0 8px}.hero h1{font-size:clamp(28px,6vw,48px);line-height:1.05;margin:0 0 12px}.lead{font-size:18px;color:#cbd6df;max-width:820px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}@media(min-width:760px){.half{grid-column:span 6}.third{grid-column:span 4}.twoThird{grid-column:span 8}}
h2{margin:0 0 10px;font-size:24px}h3{margin:0 0 8px;font-size:18px}.muted{color:var(--muted)}.small{font-size:13px}.big{font-size:30px;font-weight:850;line-height:1.1}.money{font-variant-numeric:tabular-nums}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
label{display:block;font-weight:700;margin:14px 0 6px}.help{font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
input,select{width:100%;background:#0b141d;border:1px solid #344656;color:var(--text);border-radius:12px;padding:13px 12px;min-height:48px;font-size:16px}input:focus,select:focus{outline:2px solid #4b86df;border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{border:1px solid #38506a;background:#152537;color:#eef5ff;padding:11px 15px;border-radius:12px;font-weight:750;min-height:44px}.btn.primary{background:#2e72d2;border-color:#2e72d2}.btn.green{background:#176b51;border-color:#238b6a}.btn.ghost{background:transparent}.btn.danger{border-color:#6e3535;color:#ffb0b0}.btn:disabled{opacity:.45;cursor:not-allowed}
.navrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:20px;padding-bottom:max(18px,env(safe-area-inset-bottom))}.navrow .btn{padding:10px 6px}
.pill{display:inline-block;border:1px solid #3c5064;border-radius:999px;padding:5px 9px;font-size:12px;color:#c6d3df;margin:3px 4px 3px 0}.callout{border-left:4px solid var(--blue);background:#0d1822;padding:13px 14px;border-radius:10px;margin:12px 0}.callout.amber{border-color:var(--amber)}.callout.green{border-color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}.kpi{background:#0d1720;border:1px solid #283746;border-radius:14px;padding:13px}.kpi b{display:block;font-size:20px;margin-top:4px}
.asset{border:1px solid #314252;border-radius:14px;padding:14px;margin:10px 0;background:#101b25}.assetTop{display:flex;justify-content:space-between;gap:12px}.assetActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.assetActions .btn{min-height:38px;padding:7px 10px;font-size:13px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}th,td{padding:10px;border-bottom:1px solid #2a3948;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto;border:1px solid #2a3948;border-radius:14px}.scroll table{min-width:720px}.scroll th{position:sticky;top:0;background:#14202b;z-index:2}.scroll th:first-child,.scroll td:first-child{position:sticky;left:0;background:#14202b;z-index:3}
.segment{display:flex;gap:6px;flex-wrap:wrap}.segment button{border:1px solid #3a4c5e;background:#0c1721;color:#cbd6df;border-radius:999px;padding:8px 11px}.segment button.on{background:#285f9e;color:white;border-color:#4a8fe3}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,16,24,.96);border-top:1px solid var(--line);padding:8px 10px max(8px,env(safe-area-inset-bottom));z-index:30;display:none}.bottomnav .inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bottomnav button{background:transparent;color:#9fb0bf;border:0;padding:8px 4px;font-size:12px}.bottomnav button.on{color:#8bb7ff;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#101923;border:1px solid #344656;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.4)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}.hidden{display:none!important}.right{text-align:right}.center{text-align:center}.check{display:flex;gap:10px;align-items:flex-start}.check input{width:auto;min-height:0;margin-top:5px}
.rangegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.scenario{border:1px solid #314252;border-radius:14px;padding:13px;background:#0d1720}.scenario.base{border-color:#4a8fe3}.scenario h3{font-size:15px}.scenario .big{font-size:21px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1a2936;border:1px solid #40576c;padding:10px 14px;border-radius:999px;z-index:80;display:none}
</style>
</head>
<body>
<div class="app">
<header id="hdr"><div class="brand">Savings, Wealth & Retirement Simulator</div><div class="sub" id="hdrSub">Plan from today's resources to the retirement you want.</div><div class="stepbar"><i id="progress" style="width:0"></i></div></header>
<main id="main"></main>
</div>
<div class="bottomnav" id="bottomnav"><div class="inner">
<button onclick="goHome()">â<br>Home</button><button onclick="openPortfolio()">â£<br>Portfolio</button><button onclick="openRetirement()">â<br>Retirement</button><button onclick="openGoal()">â<br>Goal</button>
</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const APP_VERSION=12,SCHEMA_VERSION=1,KEY="swr_v12_clean";
const $=id=>document.getElementById(id);
const fmt=n=>Number.isFinite(n)?"RM"+Math.round(n).toLocaleString("en-MY"):"-";
const pct=n=>Number.isFinite(n)?n.toFixed(1)+"%":"-";
function parseNumber(v,{blankZero=true}={}){let raw=String(v??"").trim().replace(/,/g,"");if(raw==="")return blankZero?0:NaN;if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw))return NaN;let x=Number(raw);return Number.isFinite(x)?x:NaN}
const defaultState=()=>({appVersion:APP_VERSION,schemaVersion:SCHEMA_VERSION,completed:false,step:0,profile:{age:45,retireAge:65,planAge:95,inflation:3,lossTolerance:"moderate",growthPreference:"balanced",retirementPriority:"real",cashReserve:0},assets:[],cash:0,goal:{monthlyToday:10000,retReturn:5,escalation:"inflation",customEsc:0,strategy:"real",extraReturn:5},ui:{lastScreen:"home",dirty:false},updated:new Date().toISOString()});
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.schemaVersion===SCHEMA_VERSION)return Object.assign(defaultState(),x)}catch(e){}return defaultState()}
function save(){S.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(S))}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function setHeader(title,step=0){$("hdrSub").textContent=title;$("progress").style.width=(step?step/7*100:0)+"%"}
function nav(back,home,next,nextFn=""){return `<div class="navrow">${back?`<button class="btn ghost" onclick="${back}">â Back</button>`:`<span></span>`}<button class="btn ghost" onclick="${home||"goHome()"}">â Home</button>${next?`<button class="btn primary" onclick="${nextFn}">${next} â</button>`:`<span></span>`}</div>`}
function monthlyRate(a){return Math.pow(1+a/100,1/12)-1}
function toToday(v,years,infl=S.profile.inflation){return v/Math.pow(1+infl/100,Math.max(0,years))}
function fromToday(v,years,infl=S.profile.inflation){return v*Math.pow(1+infl/100,Math.max(0,years))}
function yearsToRetire(){return Math.max(0,S.profile.retireAge-S.profile.age)}
function yearsRetired(){return Math.max(0,S.profile.planAge-S.profile.retireAge)}
function validateTimeline(){let p=S.profile;return Number.isFinite(p.age)&&Number.isFinite(p.retireAge)&&Number.isFinite(p.planAge)&&p.age>=18&&p.retireAge>p.age&&p.planAge>p.retireAge}
function show(html){$("main").innerHTML=html;window.scrollTo(0,0)}
function showBottom(on){$("bottomnav").style.display=on?"block":"none"}
function goHome(){save();S.ui.lastScreen="home";renderHome()}
function startPlan(){S.step=1;save();renderStep1()}
function continuePlan(){let s=Math.max(1,Math.min(7,S.step||1));({1:renderStep1,2:renderStep2,3:renderStep3,4:renderStep4,5:renderStep5,6:renderStep6,7:renderStep7}[s])()}
function renderHome(){setHeader("Plan from today's resources to the retirement you want.",0);showBottom(S.completed);if(!S.completed){show(`<section class="hero"><h1>Build toward the retirement you actually want.</h1><p class="lead">Tell the simulator what you have today, what you expect to keep saving and investing, and when you want to retire. It will connect savings, wealth creation and retirement into one plan.</p></section><div class="grid">
<div class="card twoThird"><h2>What this simulator will answer</h2><p><b>1. What are my retirement resources today?</b></p><p><b>2. What might they grow to by retirement?</b></p><p><b>3. What is that future money worth in today's purchasing power?</b></p><p><b>4. What monthly retirement drawdown might it support?</b></p><p><b>5. If my desired retirement is not supported, what gap remains?</b></p><p><b>6. Can existing unallocated cash or additional saving help close that gap?</b></p><div class="callout">This is a planning simulator, not a prediction. Results depend on the assumptions you enter. You can return and change them at any time.</div><button class="btn primary" onclick="startPlan()">Start My Plan â</button></div>
<div class="card third"><h3>Guided journey</h3><p class="muted">Timeline â Purchasing Power â Planning Profile â Retirement Resources â Wealth Projection â Retirement Outlook â Goal</p><hr><p class="small muted">Your plan is saved locally in this browser. No login or sensitive identifier is required.</p></div></div>`);return}
const P=portfolio();const R=retirementResult(S.goal.strategy,S.profile.inflation);const G=goalResult(S.profile.inflation);
show(`<section class="hero"><h1>My Retirement Plan</h1><p class="lead">Update what changed, then test whether your wealth-building path still supports the retirement you want.</p></section>
<div class="kpis"><div class="kpi">Resources today<b>${fmt(P.current)}</b></div><div class="kpi">Projected at age ${S.profile.retireAge}<b>${fmt(P.future)}</b></div><div class="kpi">Today's purchasing power<b>${fmt(toToday(P.future,yearsToRetire()))}</b></div><div class="kpi">Goal gap / surplus<b class="${G.gap>0?"bad":"good"}">${G.gap>0?"-"+fmt(G.gap):"+"+fmt(-G.gap)}</b></div></div>
<div class="grid" style="margin-top:14px"><div class="card half"><h2>Retirement goal</h2><p><span class="big">${fmt(S.goal.monthlyToday)}</span> <span class="muted">/ month in today's RM</span></p><p>Current selected approach supports about <b>${fmt(toToday(R.monthly,yearsToRetire()))}/month</b> in today's purchasing power at retirement.</p><button class="btn" onclick="openGoal()">Test My Goal</button></div>
<div class="card half"><h2>Planning profile</h2><p>${yearsToRetire()} years to retirement Â· ${S.profile.growthPreference} growth preference Â· ${S.profile.lossTolerance} decline tolerance.</p><p>Cash reserve protected: <b>${fmt(S.profile.cashReserve)}</b></p><button class="btn" onclick="S.step=3;renderStep3()">View / Edit Profile</button></div>
<div class="card half"><h2>Investment portfolio</h2><p>${S.assets.length} investment${S.assets.length===1?"":"s"} Â· ${fmt(S.cash)} unallocated cash.</p><button class="btn" onclick="openPortfolio()">View / Update</button></div>
<div class="card half"><h2>Retirement outlook</h2><p>Selected approach: <b>${strategyName(S.goal.strategy)}</b></p><button class="btn" onclick="openRetirement()">View Drawdown</button></div></div>`)}

function renderStep1(){S.step=1;save();setHeader("Step 1 of 7 - My Timeline",1);showBottom(false);let p=S.profile;show(`<div class="card"><h2>1. Your retirement timeline</h2><p class="muted">This determines how long you have to build wealth and how long your retirement resources may need to support withdrawals.</p>
<label>Your age today<input id="age" inputmode="decimal" value="${p.age}"><div class="help">Used to calculate your remaining accumulation horizon.</div></label>
<label>Age you plan to stop working / start retirement<input id="retAge" inputmode="decimal" value="${p.retireAge}"><div class="help">An earlier retirement means fewer years to build wealth and more years to fund retirement.</div></label>
<label>Age you want your retirement plan to cover through<input id="planAge" inputmode="decimal" value="${p.planAge}"><div class="help">This is the planning horizon, not a prediction of lifespan.</div></label>
<div id="timelineMsg" class="callout"></div>${nav("",null,"Continue","commitStep1()")}</div>`);timelinePreview();["age","retAge","planAge"].forEach(id=>$(id).addEventListener("input",timelinePreview))}
function timelinePreview(){let a=parseNumber($("age")?.value,{blankZero:false}),r=parseNumber($("retAge")?.value,{blankZero:false}),p=parseNumber($("planAge")?.value,{blankZero:false});let e=$("timelineMsg");if(!e)return;if(!(r>a&&p>r)){e.innerHTML="<span class='bad'>Retirement age must be after your current age, and planning age must be after retirement.</span>";return}e.innerHTML=`<b>${r-a} years</b> to continue saving and building wealth.<br><b>${p-r} years</b> of retirement funding, from age ${r} through ${p}.`}
function commitStep1(){let old=S.profile.retireAge,a=parseNumber($("age").value,{blankZero:false}),r=parseNumber($("retAge").value,{blankZero:false}),p=parseNumber($("planAge").value,{blankZero:false});if(!(Number.isFinite(a)&&r>a&&p>r)){toast("Please correct the timeline.");return}S.profile.age=a;S.profile.retireAge=r;S.profile.planAge=p;if(old!==r)toast("Timeline changed. Projections will use the new horizon.");S.step=2;save();renderStep2()}

function renderStep2(){S.step=2;save();setHeader("Step 2 of 7 - Purchasing Power",2);let i=S.profile.inflation,y=yearsToRetire();show(`<div class="card"><h2>2. Purchasing power</h2><p class="muted">Future ringgit tells you how much money you may have. Today's purchasing power tells you what that money may actually be worth to you.</p>
<label>Your long-term planning inflation % p.a.<input id="infl" inputmode="decimal" value="${i}"><div class="help">This is a long-term assumption. It is separate from any single month's latest CPI reading.</div></label>
<div id="inflDemo"></div>
<div class="callout amber"><b>Inflation sensitivity Â±1 percentage point</b><br>The simulator will also test one percentage point below and above your planning assumption. This is sensitivity analysis, not a best/base/worst forecast.</div>
${nav("renderStep1()",null,"Continue","commitStep2()")}</div>`);inflDemo();$("infl").addEventListener("input",inflDemo)}
function inflDemo(){let i=parseNumber($("infl")?.value,{blankZero:false}),y=yearsToRetire(),e=$("inflDemo");if(!e||!Number.isFinite(i)||i<0){if(e)e.innerHTML="<p class='bad'>Enter an inflation assumption of 0% or more.</p>";return}let future=100000*Math.pow(1+i/100,y),real=1000000/Math.pow(1+i/100,y);e.innerHTML=`<div class="grid"><div class="card half"><span class="muted">RM100,000 of today's purchasing power would require</span><div class="big">${fmt(future)}</div><span class="muted">at retirement in ${y} years.</span></div><div class="card half"><span class="muted">RM1,000,000 at retirement would equal about</span><div class="big">${fmt(real)}</div><span class="muted">in today's purchasing power.</span></div></div>`}
function commitStep2(){let i=parseNumber($("infl").value,{blankZero:false});if(!Number.isFinite(i)||i<0){toast("Check the inflation assumption.");return}S.profile.inflation=i;S.step=3;save();renderStep3()}

function renderStep3(){S.step=3;save();setHeader("Step 3 of 7 - My Planning Profile",3);let p=S.profile;show(`<div class="card"><h2>3. Your planning profile</h2><p class="muted">This describes how you want to think about the plan. It does not secretly change your portfolio, returns or asset allocation.</p>
<div class="callout"><b>Investment horizon: ${yearsToRetire()} years</b><br>Calculated automatically from age ${p.age} today to retirement at age ${p.retireAge}.</div>
<label>Temporary portfolio decline you could tolerate without abandoning the plan<select id="loss"><option value="small">Small decline</option><option value="moderate">Moderate decline</option><option value="large">Large decline</option></select><div class="help">Used to frame allocation scenarios and warnings, not to alter your investments automatically.</div></label>
<label>Preference while building wealth<select id="growth"><option value="stability">Capital stability</option><option value="balanced">Balance stability and growth</option><option value="growth">Long-term growth</option></select></label>
<label>Retirement capital priority<select id="priority"><option value="real">Preserve purchasing power</option><option value="nominal">Preserve starting nominal capital</option><option value="balanced">Balanced - 2.4% rule</option><option value="spend">Use capital through retirement</option></select></label>
<label>Cash reserve you want kept liquid (RM)<input id="reserve" inputmode="decimal" value="${p.cashReserve||0}"><div class="help">This amount is protected from unallocated-cash investment simulations. It is not a recommendation for how much emergency cash to hold.</div></label>
<div class="callout green"><b>How this profile is used</b><br>It helps the simulator present compatible test scenarios and explain trade-offs. You remain in control of every assumption.</div>
${nav("renderStep2()",null,"Continue","commitStep3()")}</div>`);$("loss").value=p.lossTolerance;$("growth").value=p.growthPreference;$("priority").value=p.retirementPriority}
function commitStep3(){let r=parseNumber($("reserve").value);if(!Number.isFinite(r)||r<0){toast("Cash reserve cannot be negative.");return}S.profile.lossTolerance=$("loss").value;S.profile.growthPreference=$("growth").value;S.profile.retirementPriority=$("priority").value;S.profile.cashReserve=r;S.goal.strategy=rStrategy(S.profile.retirementPriority);S.step=4;save();renderStep4()}
function rStrategy(x){return ["real","nominal","balanced","spend"].includes(x)?x:"real"}

function renderStep4(){S.step=4;save();setHeader("Step 4 of 7 - My Retirement Resources",4);let P=portfolio();show(`<div class="card"><h2>4. My retirement resources</h2><p class="muted">Record investments that realistically contribute to retirement funding. Each asset is projected independently to the same retirement age.</p>
<div class="kpis"><div class="kpi">Investments<b>${S.assets.length}</b></div><div class="kpi">Investment value today<b>${fmt(P.currentAssets)}</b></div><div class="kpi">Unallocated cash<b>${fmt(S.cash)}</b></div><div class="kpi">Total resources<b>${fmt(P.current)}</b></div></div>
<hr><div class="row"><button class="btn primary" onclick="openAssetEditor()">+ Add Investment</button><button class="btn" onclick="openCashEditor()">Update Unallocated Cash</button></div>
<div id="assetList">${assetListHTML()}</div>
<div class="callout"><b>Unallocated cash is separate.</b><br>It is not counted as an investment item and defaults to 0% growth. Later, the Goal screen can test whether investable cash could reduce a retirement gap while protecting your chosen cash reserve.</div>
${nav("renderStep3()",null,"Continue","renderStep5()")}</div>`)}
function assetListHTML(){if(!S.assets.length)return `<p class="muted">No investments added yet. RM0 is valid if you are starting from future contributions.</p>`;return S.assets.map(a=>{let q=projectAsset(a);return `<div class="asset"><div class="assetTop"><div><b>${esc(a.name)}</b><div class="small muted">${esc(typeName(a.type))}${a.included?"":" Â· Excluded"}</div></div><div class="right"><b>${fmt(a.current||0)}</b><div class="small muted">â ${q.valid?fmt(q.future):"Needs information"}</div></div></div><div class="assetActions"><button class="btn" onclick="openAssetEditor('${a.id}')">Edit</button><button class="btn" onclick="toggleAsset('${a.id}')">${a.included?"Exclude":"Restore"}</button><button class="btn danger" onclick="deleteAsset('${a.id}')">Delete</button></div></div>`}).join("")}
function typeName(t){return ({epf:"EPF",fd:"Fixed Deposit",equity:"Equity / Stock",etf:"ETF",fund:"Fund",bond:"Bond / Fixed Income",goldPhysical:"Physical Gold",goldPaper:"Paper Gold",other:"Other Investment"})[t]||t}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(){return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function openAssetEditor(id=""){let a=id?S.assets.find(x=>x.id===id):null;if(!a)a={id:uid(),type:"equity",name:"",current:0,returnRate:6,monthly:0,frequency:"monthly",contribGrowth:0,untilMode:"retirement",untilAge:S.profile.retireAge,included:true,employment:"employed",salary:0,salaryGrowth:3,bonusMonths:0,employeeRate:11,employerRate:12,voluntary:0,fdBank:"Maybank",fdTenure:12,fdRate:3,fdRenewal:3,goldMode:"value",grams:0,goldPrice:0};$("modal").classList.add("on");$("sheet").innerHTML=`<h2>${id?"Edit":"Add"} Investment</h2><label>Investment type<select id="aType" onchange="renderAssetFields()">${["epf","fd","equity","etf","fund","bond","goldPhysical","goldPaper","other"].map(t=>`<option value="${t}">${typeName(t)}</option>`).join("")}</select></label><div id="assetFields"></div><hr><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAsset('${id?"edit":"new"}')">Save Investment</button></div>`;$("sheet").dataset.asset=JSON.stringify(a);$("aType").value=a.type;renderAssetFields()}
function updateAssetDraft(k,v){let a=JSON.parse($("sheet").dataset.asset);a[k]=v;$("sheet").dataset.asset=JSON.stringify(a)}
function renderAssetFields(){let a=JSON.parse($("sheet").dataset.asset),t=$("aType").value;a.type=t;updateAssetDraft("type",t);let h="";if(t==="epf"){h=`<label>Investment name<input id="aName" value="EPF" readonly></label><label>Current EPF balance (RM)<input id="aCurrent" inputmode="decimal" value="${a.current}"></label><label>Employment type<select id="employment" onchange="updateAssetDraft('employment',this.value);renderAssetFields()"><option value="employed">Employed</option><option value="self">Self-employed / voluntary</option></select></label><div id="empFields"></div><label>Planning EPF dividend / growth % p.a.<input id="aReturn" inputmode="decimal" value="${a.returnRate}"></label><div class="callout"><b>Contribution horizon: ${yearsToRetire()} years by default.</b><br>Planning contribution rates are assumptions unless an exact statutory schedule is explicitly modelled.</div>`}

else if(t==="goldPhysical"||t==="goldPaper"){h=`<label>Investment name<input id="aName" value="${esc(a.name||typeName(t))}"></label><label>How do you want to enter the holding?<select id="goldMode" onchange="updateAssetDraft('goldMode',this.value);renderAssetFields()"><option value="value">Present cash value</option><option value="grams">Weight in grams</option></select></label><div id="goldFields"></div><label>Expected annual price appreciation % p.a.<input id="aReturn" inputmode="decimal" value="${a.returnRate}"><div class="help">Planning assumption, not a forecast.</div></label>`}
else{h=`<label>Investment name<input id="aName" value="${esc(a.name||typeName(t))}"></label><label>Current / starting capital (RM)<input id="aCurrent" inputmode="decimal" value="${a.current}"></label><label>Regular contribution (RM)<input id="aMonthly" inputmode="decimal" value="${a.monthly}"><div class="help">Enter the amount per selected frequency. RM0 is valid.</div></label><label>Contribution frequency<select id="aFreq"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="yearly">Yearly</option></select></label><label>Annual contribution increase %<input id="aGrowth" inputmode="decimal" value="${a.contribGrowth}"></label><label>Contribute until<select id="untilMode" onchange="document.getElementById('untilWrap').classList.toggle('hidden',this.value!=='age')"><option value="retirement">Until retirement</option><option value="age">Specific age</option></select></label><div id="untilWrap" class="${a.untilMode==="age"?"":"hidden"}"><label>Contribution end age<input id="untilAge" inputmode="decimal" value="${a.untilAge}"></label></div><label>Long-term planning return % p.a.<input id="aReturn" inputmode="decimal" value="${a.returnRate}"><div class="help">A planning assumption. Actual returns can vary substantially.</div></label>`}
h+=`<label class="check"><input type="checkbox" id="aIncluded" ${a.included?"checked":""}><span>Include in retirement plan<div class="help">Excluding keeps the investment saved but removes it from calculations.</div></span></label>`;$("assetFields").innerHTML=h;
if(t==="epf"){let e=$("employment");e.value=a.employment||"employed";let d=e.value==="employed"?`<label>Current monthly salary (RM)<input id="salary" inputmode="decimal" value="${a.salary}"></label><label>Expected yearly salary increment %<input id="salaryGrowth" inputmode="decimal" value="${a.salaryGrowth}"></label><label>Expected bonus (months of salary)<input id="bonus" inputmode="decimal" value="${a.bonusMonths}"></label><label>Employee contribution assumption %<input id="employeeRate" inputmode="decimal" value="${a.employeeRate}"></label><label>Employer contribution assumption %<input id="employerRate" inputmode="decimal" value="${a.employerRate}"></label>`:`<label>Voluntary contribution per month (RM)<input id="voluntary" inputmode="decimal" value="${a.voluntary}"></label><label>Expected yearly increase %<input id="salaryGrowth" inputmode="decimal" value="${a.salaryGrowth}"></label>`;$("empFields").innerHTML=d}
if(t==="fd")$("fdBank").value=a.fdBank||"Maybank";
if(t==="goldPhysical"||t==="goldPaper"){let gm=$("goldMode");gm.value=a.goldMode||"value";$("goldFields").innerHTML=gm.value==="grams"?`<label>Weight (grams)<input id="grams" inputmode="decimal" value="${a.grams}"></label><label>Valuation price per gram (RM)<input id="goldPrice" inputmode="decimal" value="${a.goldPrice}"><div class="help">For an existing holding, a realizable/sell-back price is generally more relevant. Enter a verified current or custom price.</div></label>`:`<label>Present cash value (RM)<input id="aCurrent" inputmode="decimal" value="${a.current}"></label>`}
if($("aFreq"))$("aFreq").value=a.frequency||"monthly";if($("untilMode"))$("untilMode").value=a.untilMode||"retirement"}

else{a.current=num("aCurrent");a.monthly=num("aMonthly");a.frequency=$("aFreq").value;a.contribGrowth=num("aGrowth");a.untilMode=$("untilMode").value;a.untilAge=a.untilMode==="retirement"?S.profile.retireAge:num("untilAge");a.returnRate=num("aReturn")}
let q=projectAsset(a);if(!q.valid){toast(q.error||"Please check the investment fields.");return}if(a.returnRate>15)toast("High long-term return assumption - review carefully.");if(mode==="new")S.assets.push(a);else{let i=S.assets.findIndex(x=>x.id===a.id);S.assets[i]=a}save();closeModal();renderStep4()}
function closeModal(){$("modal").classList.remove("on");$("sheet").innerHTML=""}

function openCashEditor(){$("modal").classList.add("on");$("sheet").innerHTML=`<h2>Unallocated Cash</h2><p class="muted">Cash available but not assigned to an investment. It is projected at 0% unless you test an allocation scenario later.</p><label>Current unallocated cash (RM)<input id="cashInput" inputmode="decimal" value="${S.cash}"></label><div class="callout">Your protected cash reserve in the Planning Profile is ${fmt(S.profile.cashReserve)}. Goal simulations will not allocate that protected amount.</div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCash()">Save Cash</button></div>`}
function saveCash(){let x=parseNumber($("cashInput").value);if(!Number.isFinite(x)||x<0){toast("Cash cannot be negative.");return}S.cash=x;save();closeModal();renderStep4()}

function projectAsset(a){let months=Math.round(yearsToRetire()*12);if(months<0)return {valid:false,error:"Invalid timeline"};for(const k of ["current"])if(!Number.isFinite(+a[k])||+a[k]<0)return {valid:false,error:"Capital cannot be negative"};
if(a.type==="fd")return projectFD(a,months);if(a.type==="epf")return projectEPF(a,months);
let rate=+a.returnRate;if(!Number.isFinite(rate)||rate<=-100)return {valid:false,error:"Return must be greater than -100%"};let bal=+a.current||0,contrib=0,mr=monthlyRate(rate),endMonths=months;if(a.untilMode==="age")endMonths=Math.max(0,Math.min(months,Math.round((+a.untilAge-S.profile.age)*12)));let freq={monthly:1,quarterly:3,yearly:12}[a.frequency]||1,base=+a.monthly||0,g=+a.contribGrowth||0;if(base<0||g<-100)return {valid:false,error:"Contribution inputs are invalid"};for(let m=1;m<=months;m++){bal*=1+mr;if(m<=endMonths&&m%freq===0){let yr=Math.floor((m-1)/12),c=base*Math.pow(1+g/100,yr);bal+=c;contrib+=c}if(!Number.isFinite(bal)||Math.abs(bal)>1e15)return {valid:false,error:"Projection exceeded supported range"}}return {valid:true,future:bal,contrib,growth:bal-(+a.current||0)-contrib}}
function projectEPF(a,months){let rate=+a.returnRate;if(!Number.isFinite(rate)||rate<=-100)return {valid:false,error:"Check EPF growth rate"};let bal=+a.current||0,mr=monthlyRate(rate),emp=0,er=0;for(let m=1;m<=months;m++){bal*=1+mr;let yr=Math.floor((m-1)/12),c=0;if(a.employment==="self"){c=(+a.voluntary||0)*Math.pow(1+(+a.salaryGrowth||0)/100,yr);emp+=c}else{let sal=(+a.salary||0)*Math.pow(1+(+a.salaryGrowth||0)/100,yr),base=sal;if(m%12===0)base+=sal*(+a.bonusMonths||0);let ec=base*(+a.employeeRate||0)/100,rc=base*(+a.employerRate||0)/100;c=ec+rc;emp+=ec;er+=rc}bal+=c;if(!Number.isFinite(bal)||bal>1e15)return {valid:false,error:"EPF projection exceeded supported range"}}return {valid:true,future:bal,contrib:emp+er,employee:emp,employer:er,growth:bal-(+a.current||0)-emp-er}}
function projectFD(a,months){let bal=+a.current||0,ten=Math.round(+a.fdTenure),first=+a.fdRate,renew=+a.fdRenewal;if(!(ten>0&&Number.isFinite(first)&&first>-100&&Number.isFinite(renew)&&renew>-100))return {valid:false,error:"Check FD tenure and rates"};let elapsed=0,growth=0,cycle=0;while(elapsed<months){let span=Math.min(ten,months-elapsed),rate=cycle===0?first:renew;let interest=bal*(rate/100)*(span/12);bal+=interest;growth+=interest;elapsed+=span;cycle++;if(!Number.isFinite(bal)||bal>1e15)return {valid:false,error:"FD projection exceeded supported range"}}return {valid:true,future:bal,contrib:0,growth}}
function portfolio(){let currentAssets=0,futureAssets=0,contrib=0,growth=0,invalid=[];for(const a of S.assets){if(!a.included)continue;let q=projectAsset(a);if(!q.valid){invalid.push({a,q});continue}currentAssets+=+a.current||0;futureAssets+=q.future;contrib+=q.contrib||0;growth+=q.growth||0}return {currentAssets,current:currentAssets+S.cash,future:futureAssets+S.cash,contrib,growth,invalid}}
function renderStep5(){S.step=5;save();setHeader("Step 5 of 7 - My Wealth Projection",5);let P=portfolio();if(P.invalid.length){show(`<div class="card"><h2>5. My wealth projection</h2><div class="callout amber"><b>Some included investments need attention.</b><br>${P.invalid.map(x=>esc(x.a.name)+": "+esc(x.q.error)).join("<br>")}</div><button class="btn" onclick="renderStep4()">Review Portfolio</button>${nav("renderStep4()",null,"Continue","renderStep6()")}</div>`);return}
let rows=S.assets.filter(a=>a.included).map(a=>{let q=projectAsset(a);return `<tr><td>${esc(a.name)}</td><td>${fmt(a.current)}</td><td>${fmt(q.contrib||0)}</td><td>${fmt(q.growth||0)}</td><td>${fmt(q.future)}</td></tr>`}).join("")+`<tr><td>Unallocated Cash</td><td>${fmt(S.cash)}</td><td>-</td><td>-</td><td>${fmt(S.cash)}</td></tr>`;
show(`<div class="card"><h2>5. My wealth projection</h2><p class="muted">See how today's resources, future contributions and assumed growth combine into retirement capital.</p>
<div class="kpis"><div class="kpi">Resources today<b>${fmt(P.current)}</b></div><div class="kpi">Future contributions<b>${fmt(P.contrib)}</b></div><div class="kpi">Investment growth<b>${fmt(P.growth)}</b></div><div class="kpi">At age ${S.profile.retireAge}<b>${fmt(P.future)}</b></div></div>

<p class="small muted">Reconciliation: starting resources + future contributions + investment growth = projected retirement resources. Unallocated cash is held at 0% in the base plan.</p>
${nav("renderStep4()",null,"Continue","renderStep6()")}</div>`)}

function strategyName(s){return ({real:"Preserve Purchasing Power",nominal:"Preserve Starting Capital",balanced:"Balanced - 2.4% Rule",spend:"Spend Down"})[s]}
function simulateRetirement(monthly,strategy,infl=S.profile.inflation,detail=false){let P=portfolio(),bal=P.future,months=Math.round(yearsRetired()*12),r=monthlyRate(S.goal.retReturn),esc=S.goal.escalation==="inflation"?infl:(S.goal.escalation==="custom"?S.goal.customEsc:0),rows=[],total=0;for(let m=1;m<=months;m++){bal*=1+r;let yr=Math.floor((m-1)/12),d=monthly*Math.pow(1+esc/100,yr);bal-=d;total+=d;if(detail&&(m%12===0)){let age=S.profile.retireAge+m/12,yearsFromToday=yearsToRetire()+m/12;rows.push({age,bal,draw:d,realBal:toToday(bal,yearsFromToday,infl),realDraw:toToday(d,yearsFromToday,infl)})}if(!Number.isFinite(bal)||Math.abs(bal)>1e16)return {ok:false}}return {ok:true,end:bal,total,rows}}
function targetEnd(strategy,infl){let P=portfolio(),yrs=yearsRetired();if(strategy==="real")return P.future*Math.pow(1+infl/100,yrs);if(strategy==="nominal")return P.future;if(strategy==="spend")return 0;return NaN}
function solveMonthly(strategy,infl=S.profile.inflation){let P=portfolio();if(P.future<=0)return 0;if(strategy==="balanced")return P.future*.024/12;let target=targetEnd(strategy,infl),z=simulateRetirement(0,strategy,infl);if(!z.ok||z.end<target)return 0;let lo=0,hi=Math.max(P.future/12,1);for(let i=0;i<80;i++){let x=simulateRetirement(hi,strategy,infl);if(!x.ok||x.end<=target)break;hi*=2}for(let i=0;i<90;i++){let mid=(lo+hi)/2,x=simulateRetirement(mid,strategy,infl);if(x.ok&&x.end>target)lo=mid;else hi=mid}return (lo+hi)/2}
function retirementResult(strategy=S.goal.strategy,infl=S.profile.inflation){let monthly=solveMonthly(strategy,infl),sim=simulateRetirement(monthly,strategy,infl,true);return {monthly,...sim}}
function strategyInfo(s){return ({real:["Targets ending capital with approximately the same purchasing power as retirement-start capital.","Usually supports a lower starting drawdown because real capital is preserved."],nominal:["Targets ending nominal capital approximately equal to retirement-start capital.","Inflation can reduce the purchasing power of the remaining capital."],balanced:["Starts at 2.4% of retirement capital per year, divided monthly.","This is an inherited planning rule, not an industry-standard definition of Balanced."],spend:["Targets capital near zero at the selected planning age.","Supports more drawdown but intentionally leaves little or no residual capital."]})[s]}
function renderStep6(){S.step=6;save();setHeader("Step 6 of 7 - Retirement Outlook",6);let P=portfolio();if(P.invalid.length||P.future<=0){show(`<div class="card"><h2>6. Retirement outlook</h2><div class="callout amber">Add or correct included retirement resources before calculating drawdown.</div>${nav("renderStep5()",null,"Continue","renderStep7()")}</div>`);return}let R=retirementResult(),info=strategyInfo(S.goal.strategy),sens=inflationSensitivity();show(`<div class="card"><h2>6. My retirement outlook</h2><p class="muted">What could your projected wealth provide during retirement?</p>
<div class="kpis"><div class="kpi">At retirement<b>${fmt(P.future)}</b></div><div class="kpi">Today's purchasing power<b>${fmt(toToday(P.future,yearsToRetire()))}</b></div><div class="kpi">Starting drawdown<b>${fmt(R.monthly)}/mo</b></div><div class="kpi">Today's RM equivalent<b>${fmt(toToday(R.monthly,yearsToRetire()))}/mo</b></div></div>
<label>Drawdown approach<select id="strategy" onchange="changeStrategy(this.value)"><option value="real">Preserve Purchasing Power</option><option value="nominal">Preserve Starting Capital</option><option value="balanced">Balanced - 2.4% Rule</option><option value="spend">Spend Down</option></select></label>
<div class="callout"><b>${strategyName(S.goal.strategy)}</b><br>${info[0]}<br><span class="muted">${info[1]}</span></div>
<label>Retirement portfolio return assumption % p.a.<input id="retReturn" inputmode="decimal" value="${S.goal.retReturn}" onchange="updateRetSettings()"></label>
<label>Drawdown increase<select id="esc" onchange="updateRetSettings()"><option value="none">No increase</option><option value="inflation">Match planning inflation</option><option value="custom">Custom annual increase</option></select></label>
<div id="customEscWrap" class="${S.goal.escalation==="custom"?"":"hidden"}"><label>Custom annual increase %<input id="customEsc" inputmode="decimal" value="${S.goal.customEsc}" onchange="updateRetSettings()"></label></div>
<h3 style="margin-top:20px">Inflation sensitivity Â±1%</h3>${sensitivityHTML(sens)}
<h3 style="margin-top:20px">Year-by-Year Retirement Projection</h3><div class="segment"><button id="fiveBtn" class="on" onclick="renderRetTable(5)">Every 5 years</button><button id="oneBtn" onclick="renderRetTable(1)">Every year</button></div><div id="retTable" style="margin-top:10px"></div>
${nav("renderStep5()",null,"Set My Retirement Goal","renderStep7()")}</div>`);$("strategy").value=S.goal.strategy;$("esc").value=S.goal.escalation;renderRetTable(5)}
function changeStrategy(v){S.goal.strategy=v;save();renderStep6()}
function updateRetSettings(){let r=parseNumber($("retReturn").value,{blankZero:false});if(!Number.isFinite(r)||r<=-100){toast("Retirement return must be greater than -100%.");return}S.goal.retReturn=r;S.goal.escalation=$("esc").value;if(S.goal.escalation==="custom"){let c=parseNumber($("customEsc")?.value);if(!Number.isFinite(c)){toast("Check custom escalation.");return}S.goal.customEsc=c}save();renderStep6()}
function renderRetTable(step){let R=retirementResult();$("fiveBtn")?.classList.toggle("on",step===5);$("oneBtn")?.classList.toggle("on",step===1);let rows=R.rows.filter((x,i)=>step===1||i===0||Math.round(x.age-S.profile.retireAge)%step===0||i===R.rows.length-1).map(x=>`<tr><td>${Math.round(x.age)}</td><td>${fmt(Math.max(0,x.bal))}</td><td>${fmt(Math.max(0,x.realBal))}</td><td>${fmt(x.draw)}</td><td>${fmt(x.realDraw)}</td></tr>`).join("");$("retTable").innerHTML=`<div class="scroll"><table><thead><tr><th>Age</th><th>Ending Capital</th><th>Capital in Today's RM</th><th>Monthly Drawdown</th><th>Drawdown in Today's RM</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function inflationSensitivity(){let b=S.profile.inflation;return [Math.max(0,b-1),b,b+1].map(i=>{let R=retirementResult(S.goal.strategy,i);return {infl:i,monthly:R.monthly,realMonthly:toToday(R.monthly,yearsToRetire(),i),end:R.end,realEnd:toToday(Math.max(0,R.end),yearsToRetire()+yearsRetired(),i)}})}
function sensitivityHTML(a){return `<div class="rangegrid">${a.map((x,i)=>`<div class="scenario ${i===1?"base":""}"><h3>${pct(x.infl)} inflation${i===1?" Â· planning":""}</h3><div class="big">${fmt(x.realMonthly)}/mo</div><div class="small muted">starting drawdown in today's RM</div><hr><div class="small">Ending capital today-RM<br><b>${fmt(x.realEnd)}</b></div></div>`).join("")}</div>`}

function requiredCapitalForGoal(infl=S.profile.inflation){let desiredFuture=fromToday(S.goal.monthlyToday,yearsToRetire(),infl),months=Math.round(yearsRetired()*12),r=monthlyRate(S.goal.retReturn),esc=S.goal.escalation==="inflation"?infl:(S.goal.escalation==="custom"?S.goal.customEsc:0);let targetFactor=S.goal.strategy==="real"?Math.pow(1+infl/100,yearsRetired()):(S.goal.strategy==="nominal"?1:0);if(S.goal.strategy==="balanced")return desiredFuture*12/.024;let lo=0,hi=1e6;function endFrom(cap){let bal=cap;for(let m=1;m<=months;m++){bal*=1+r;let yr=Math.floor((m-1)/12);bal-=desiredFuture*Math.pow(1+esc/100,yr)}return bal-cap*targetFactor}while(endFrom(hi)<0&&hi<1e15)hi*=2;for(let i=0;i<100;i++){let mid=(lo+hi)/2;if(endFrom(mid)>=0)hi=mid;else lo=mid}return (lo+hi)/2}
function goalResult(infl=S.profile.inflation){let P=portfolio(),req=requiredCapitalForGoal(infl),gap=req-P.future;return {required:req,gap,desiredFuture:fromToday(S.goal.monthlyToday,yearsToRetire(),infl)}}
function extraMonthlyForGap(gap,annual){if(gap<=0)return 0;let n=Math.round(yearsToRetire()*12),r=monthlyRate(annual);if(n<=0)return gap;if(Math.abs(r)<1e-12)return gap/n;return gap*r/(Math.pow(1+r,n)-1)}
function investableCash(){return Math.max(0,S.cash-S.profile.cashReserve)}
function profileScenario(){let inv=investableCash(),g=S.profile.growthPreference;let cash=0,fixed=0,growth=0;if(g==="stability"){cash=.25;fixed=.6;growth=.15}else if(g==="growth"){cash=.1;fixed=.25;growth=.65}else{cash=.15;fixed=.45;growth=.4}return {inv,cash:inv*cash,fixed:inv*fixed,growth:inv*growth,fixedRate:3,growthRate:6}}
function scenarioFuture(sc){let y=yearsToRetire();return sc.cash+sc.fixed*Math.pow(1+sc.fixedRate/100,y)+sc.growth*Math.pow(1+sc.growthRate/100,y)}
function renderStep7(){S.step=7;save();setHeader("Step 7 of 7 - My Retirement Goal",7);let G=goalResult(),P=portfolio(),R=retirementResult(),extra=extraMonthlyForGap(Math.max(0,G.gap),S.goal.extraReturn),sc=profileScenario(),scFuture=scenarioFuture(sc),baseCashFuture=sc.inv,improve=scFuture-baseCashFuture,newGap=G.gap-improve;show(`<div class="card"><h2>7. Is this enough for the retirement you want?</h2><p class="muted">Enter the monthly lifestyle you want in today's purchasing power. The simulator works backward to estimate the retirement capital it would require.</p>
<label>Desired monthly retirement lifestyle in today's RM<input id="goalMonthly" inputmode="decimal" value="${S.goal.monthlyToday}" onchange="updateGoal()"></label>
<div class="kpis"><div class="kpi">Desired today<b>${fmt(S.goal.monthlyToday)}/mo</b></div><div class="kpi">Future RM at age ${S.profile.retireAge}<b>${fmt(G.desiredFuture)}/mo</b></div><div class="kpi">Required capital<b>${fmt(G.required)}</b></div><div class="kpi">Projected capital<b>${fmt(P.future)}</b></div></div>
<div class="callout ${G.gap>0?"amber":"green"}"><b>${G.gap>0?"Projected capital gap":"Projected capital surplus"}: ${fmt(Math.abs(G.gap))}</b><br>${G.gap>0?"The current plan does not fully support the selected goal under these assumptions. Use the simulations below to test ways of narrowing the gap.":"The current plan exceeds the estimated capital required under these assumptions."}</div>
<h3>First: test resources you already have</h3><p>Unallocated cash: <b>${fmt(S.cash)}</b> Â· protected cash reserve: <b>${fmt(S.profile.cashReserve)}</b> Â· available to test: <b>${fmt(sc.inv)}</b>.</p>
${sc.inv>0?`<div class="card"><h3>Profile-compatible allocation test</h3><p class="muted">This is a user-controlled scenario, not an investment recommendation. It does not move your money or change your saved portfolio.</p><div class="kpis"><div class="kpi">Keep liquid in test<b>${fmt(sc.cash)}</b></div><div class="kpi">Fixed-income assumption<b>${fmt(sc.fixed)} @ ${sc.fixedRate}%</b></div><div class="kpi">Growth assumption<b>${fmt(sc.growth)} @ ${sc.growthRate}%</b></div><div class="kpi">Extra retirement capital<b>${fmt(improve)}</b></div></div><p>Estimated gap after this test: <b class="${newGap>0?"bad":"good"}">${newGap>0?fmt(newGap):"Surplus "+fmt(-newGap)}</b></p><button class="btn" onclick="openAllocationTest()">Adjust Test Allocation</button></div>`:`<div class="callout">There is no investable unallocated cash after protecting your chosen cash reserve.</div>`}
<h3 style="margin-top:20px">Then: test additional saving</h3><label>Assumed return on additional monthly accumulation % p.a.<input id="extraReturn" inputmode="decimal" value="${S.goal.extraReturn}" onchange="updateGoal()"><div class="help">This assumption is required because RM1 saved in cash and RM1 invested at a positive return do not produce the same retirement value.</div></label>
<div class="callout"><b>Additional monthly accumulation to test: ${fmt(extra)}/month</b><br>Calculated against the current capital gap before any optional cash-allocation scenario. Change assumptions to see how the requirement moves.</div>
<h3>Inflation sensitivity Â±1%</h3>${goalSensitivityHTML()}
<div class="row"><button class="btn" onclick="S.profile.retireAge+=1;save();renderStep7()">Test retirement 1 year later</button><button class="btn" onclick="renderStep4()">Change Portfolio</button><button class="btn" onclick="renderStep2()">Change Inflation</button></div>
${nav("renderStep6()",null,"Finish","finishPlan()")}</div>`)}
function updateGoal(){let m=parseNumber($("goalMonthly").value,{blankZero:false}),r=parseNumber($("extraReturn").value,{blankZero:false});if(!(Number.isFinite(m)&&m>=0&&Number.isFinite(r)&&r>-100)){toast("Check the goal inputs.");return}S.goal.monthlyToday=m;S.goal.extraReturn=r;save();renderStep7()}
function goalSensitivityHTML(){let b=S.profile.inflation,a=[Math.max(0,b-1),b,b+1].map(i=>{let g=goalResult(i);return {i,req:g.required,gap:g.gap,future:g.desiredFuture}});return `<div class="rangegrid">${a.map((x,j)=>`<div class="scenario ${j===1?"base":""}"><h3>${pct(x.i)}${j===1?" Â· planning":""}</h3><div class="small">Future lifestyle target</div><b>${fmt(x.future)}/mo</b><hr><div class="small">Required capital</div><b>${fmt(x.req)}</b><div class="small ${x.gap>0?"bad":"good"}">${x.gap>0?"Gap ":"Surplus "}${fmt(Math.abs(x.gap))}</div></div>`).join("")}</div>`}
function openAllocationTest(){let sc=profileScenario();$("modal").classList.add("on");$("sheet").innerHTML=`<h2>Test Unallocated Cash Allocation</h2><p class="muted">Nothing here changes your actual portfolio. This tests how deploying investable cash under different return assumptions could affect retirement.</p><div class="callout">Available to test after cash reserve: <b>${fmt(sc.inv)}</b></div><label>Keep liquid in this test (RM)<input id="scCash" inputmode="decimal" value="${Math.round(sc.cash)}"></label><label>Fixed-income allocation (RM)<input id="scFixed" inputmode="decimal" value="${Math.round(sc.fixed)}"></label><label>Fixed-income planning return %<input id="scFixedRate" inputmode="decimal" value="${sc.fixedRate}"></label><label>Growth allocation (RM)<input id="scGrowth" inputmode="decimal" value="${Math.round(sc.growth)}"></label><label>Growth planning return %<input id="scGrowthRate" inputmode="decimal" value="${sc.growthRate}"></label><div id="scMsg"></div><div class="row"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn primary" onclick="calcAllocation()">Calculate Scenario</button></div>`}
function calcAllocation(){let sc={inv:investableCash(),cash:parseNumber($("scCash").value),fixed:parseNumber($("scFixed").value),growth:parseNumber($("scGrowth").value),fixedRate:parseNumber($("scFixedRate").value),growthRate:parseNumber($("scGrowthRate").value)};let total=sc.cash+sc.fixed+sc.growth;if([sc.cash,sc.fixed,sc.growth].some(x=>!Number.isFinite(x)||x<0)||Math.abs(total-sc.inv)>1){$("scMsg").innerHTML=`<p class="bad">Allocation must equal ${fmt(sc.inv)}.</p>`;return}let improve=scenarioFuture(sc)-sc.inv,G=goalResult(),gap=G.gap-improve;$("scMsg").innerHTML=`<div class="callout green"><b>Scenario effect</b><br>Additional retirement capital versus leaving this investable cash at 0%: <b>${fmt(improve)}</b><br>Estimated goal ${gap>0?"gap":"surplus"} after scenario: <b>${fmt(Math.abs(gap))}</b></div>`}
function finishPlan(){S.completed=true;S.step=7;save();renderHome();toast("Plan saved in this browser.")}
function openPortfolio(){S.step=4;renderStep4()}function openRetirement(){S.step=6;renderStep6()}function openGoal(){S.step=7;renderStep7()}
function exportPlan(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="retirement-plan-v12.json";a.click();URL.revokeObjectURL(a.href)}
function resetPlan(){if(confirm("Reset this plan? Export first if you want a backup.")){localStorage.removeItem(KEY);S=defaultState();renderHome()}}
renderHome();
</script>
